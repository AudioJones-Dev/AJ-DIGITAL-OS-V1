# AJ Digital — Central Domain Registry
# Governance scope: ALL domains. Workspace scope: only where email identity is required.
# "Managed under AJ Digital" = centrally governed, NOT "every domain becomes an AJ Digital alias."
#
# Live data captured 2026-07-30 (read-only):
#   - zone_id / cf account : Cloudflare API
#   - expires / lock       : RDAP
#   - mail_live / spf/dmarc: public DNS resolution via 1.1.1.1
# Classification fields are RECOMMENDATIONS pending validation against ownership,
# client agreements, and intended use.

meta:
  captured: 2026-07-30
  cloudflare_account: "Bookaudiojones@gmail.com's Account"
  cloudflare_account_id: aed31038e91e296cb7b644ec2afc68eb
  registrar_all: cloudflare
  zone_count: 12
  registrar_lock_all: true          # every domain: "client transfer prohibited"
  auto_renew_status: UNVERIFIED     # DNS token lacks Registrar scope (403/10000)

# Read-only registry checks to run per domain each audit cycle
registry_checks:
  - registrar_lock         # RDAP status contains clientTransferProhibited  -> VERIFIED for all 12
  - auto_renew             # requires Cloudflare token with Registrar:Read  -> BLOCKED
  - expiry_within_90d
  - nameserver_drift
  - mail_provider_drift
  - spf_single_record
  - dmarc_present

